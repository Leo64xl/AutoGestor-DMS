server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La navegacion de la aplicacion vive en el estado de Redux, no en la URL,
    # pero un refresco sobre cualquier ruta debe devolver el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con huella en el nombre pueden cachearse de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index nunca se cachea: es quien apunta a la version vigente del bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
